  const k=h.get('k'), go=h.get('go');
  if(!k) throw 0;
  const pad=s=>s+'='.repeat((4-s.length%4)%4);
  const kb=Uint8Array.from(atob(pad(k.replace(/-/g,'+').replace(/_/g,'/'))),c=>c.charCodeAt(0));
  const raw=Uint8Array.from(atob(document.getElementById('p').textContent),c=>c.charCodeAt(0));
  const key=await crypto.subtle.importKey('raw',kb,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},key,raw.slice(12));
  const html=new TextDecoder().decode(pt);
  const goScript='<scr'+'ipt>window.addEventListener("load",function(){var h=new URLSearchParams(location.hash.slice(1));var g=h.get("go");if(g){var b=document.querySelector("nav button[data-p=p-"+g+"]");if(b)b.click();}});</scr'+'ipt>';
  const out=html.replace('</body>', goScript+'</body>');
  document.open();document.write(out);document.close();
 }catch(e){document.getElementById('m').innerHTML='<p><b>This link is missing its key.</b><br>Open the binder from the full link in Kelsie\'s text message &mdash; the part after the # matters. Or text Kelsie at 801-420-2284 and she will resend it.</p>';}
